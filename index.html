<style>
:root{--bg:#f5f7fb;--surface:#fff;--ink:#172033;--muted:#6b7485;--line:#e6eaf0;--brand:#6d5dfc;--brand2:#4c3fe0;--success:#15803d;--warning:#b45309;--danger:#b42318;--shadow:0 12px 35px rgba(17,24,39,.08);--r:18px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:260px;background:#0b1220;color:#dbe4f4;padding:22px 14px;z-index:20;overflow:auto}.logo{font-size:23px;font-weight:900;padding:8px 12px 25px}.logo span{color:#9c92ff}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#aebbd0;text-align:left;padding:12px 14px;border-radius:12px}.nav button:hover,.nav button.active{background:#1b2740;color:#fff}.main{margin-left:260px;min-height:100vh}.top{height:72px;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.top-left{display:flex;align-items:center;gap:12px}.menu{display:none;border:0;background:none;font-size:25px}.content{padding:28px;max-width:1500px;margin:auto}.page-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:22px}.page-head h1{margin:0 0 5px;font-size:28px}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.card{padding:20px}.metric{font-size:31px;font-weight:850;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.panel{padding:20px}.panel h2,.panel h3{margin:0 0 16px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}.table th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:750}.primary{background:var(--brand);color:#fff}.primary:hover{background:var(--brand2)}.ghost{background:#eef1f6;color:var(--ink)}.danger{background:#feeceb;color:var(--danger)}.success{background:#eaf7ef;color:var(--success)}.warning{background:#fff5e8;color:var(--warning)}.small{padding:7px 10px;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select{min-width:190px}.field{display:grid;gap:7px;margin-bottom:13px}.field label{font-size:13px;font-weight:750}.field input,.field select,.field textarea{width:100%;border:1px solid #d9dee8;border-radius:11px;padding:11px 12px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(109,93,252,.12)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.modal{position:fixed;inset:0;background:rgba(7,12,22,.58);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.open{display:flex}.modal-box{background:#fff;border-radius:20px;width:min(780px,100%);max-height:90vh;overflow:auto;padding:23px}.modal-box h2{margin-top:0}.badge{display:inline-flex;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800}.badge.active,.badge.confirmed,.badge.published,.badge.approved{background:#eaf7ef;color:#15803d}.badge.inactive,.badge.rejected{background:#feeceb;color:#b42318}.badge.pending,.badge.draft,.badge.submitted{background:#fff5e8;color:#b45309}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:white;padding:13px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:100;max-width:360px}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top right,#e8e4ff,#f5f7fb 45%)}.auth-card{width:min(470px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 25px 70px rgba(30,41,59,.13)}.auth-logo{font-size:31px;font-weight:950}.auth-logo span{color:var(--brand)}.auth-card h1{font-size:25px;margin:8px 0}.auth-switch{display:flex;justify-content:space-between;margin-top:12px}.link{color:var(--brand2);font-weight:750;cursor:pointer}.empty{padding:35px;text-align:center;color:var(--muted)}.kpi-list{display:grid;gap:9px}.kpi-row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 0}.print-only{display:none}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:none}.main{margin-left:0}.menu{display:block}.grid{grid-template-columns:1fr}}
@media(max-width:650px){.content{padding:17px}.top{padding:0 15px}.cards,.form-grid{grid-template-columns:1fr}.top .who{display:none}.page-head{flex-direction:column}.table th,.table td{padding:10px 8px}.auth-card{padding:22px}}
@media print{.sidebar,.top,.no-print{display:none!important}.main{margin:0}.content{padding:0}.print-only{display:block}.panel,.card{box-shadow:none;border:1px solid #ccc}}

<body>
<div id="root"></div>
<div id="modal" class="modal"><div class="modal-box" id="modalBox"></div></div>
<div id="toast"></div>

<script type="module">
import {initializeApp, getApps, getApp, deleteApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,getDocs,query,where,orderBy,limit,setDoc,addDoc,updateDoc,deleteDoc,serverTimestamp,writeBatch} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {getStorage,ref,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";

const firebaseConfig={apiKey:"AIzaSyCn6urJZ6tKBJTgBv9mjywQTKeoaZIhFYw",authDomain:"edunexa-70b24.firebaseapp.com",projectId:"edunexa-70b24",storageBucket:"edunexa-70b24.firebasestorage.app",messagingSenderId:"845157830674",appId:"1:845157830674:web:b8a83619da9249a38fc8cb",measurementId:"G-FYMKF3C4T8"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app);
let me=null,school=null,currentView="dashboard",cache={};

const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const toast=(m)=>{const e=$("#toast");e.textContent=m;e.className="toast";clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.className="",3500)};
const fmtDate=v=>v?.toDate?v.toDate().toLocaleDateString():v?new Date(v).toLocaleDateString():"—";
const nowDate=()=>new Date().toISOString().slice(0,10);
const uid=()=>auth.currentUser?.uid;
const active=v=>v!==false;
function openModal(html){$("#modalBox").innerHTML=html;$("#modal").classList.add("open")}
function closeModal(){$("#modal").classList.remove("open")}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
function statusBadge(s){return `<span class="badge ${String(s||"active").toLowerCase()}">${esc(s||"Active")}</span>`}
function navItems(role){
 if(role==="superAdmin")return [["dashboard","Dashboard"],["schools","Schools"],["admins","School Admins"],["profile","Profile"]];
 if(role==="schoolAdmin")return [["dashboard","Dashboard"],["students","Students"],["teachers","Teachers"],["classes","Classes"],["subjects","Subjects"],["assignments","Assignments"],["sessions","Sessions"],["attendance","Attendance"],["results","Results"],["fees","Fees"],["payments","Payments"],["announcements","Announcements"],["reports","Reports"],["settings","Settings"],["profile","Profile"]];
 if(role==="teacher")return [["dashboard","Dashboard"],["attendance","Attendance"],["results","Results"],["announcements","Announcements"],["profile","Profile"]];
 return [["dashboard","Dashboard"],["results","Results"],["attendance","Attendance"],["fees","Fees"],["payments","Payments"],["announcements","Announcements"],["profile","Profile"]];
}
function shell(){return `<div class="app"><aside class="sidebar" id="side"><div class="logo">Edu<span>Nexa</span></div><div class="nav">${navItems(me.role).map(([id,label])=>`<button data-nav="${id}" class="${currentView===id?"active":""}">${label}</button>`).join("")}</div></aside><main class="main"><header class="top"><div class="top-left"><button class="menu" id="menu">☰</button><strong id="title">Dashboard</strong></div><div class="who">${esc(me.fullName||me.email)} · ${esc(me.role)}</div><button class="btn ghost small" id="logout">Log out</button></header><section class="content" id="content"></section></main></div>`}
function authScreen(){return `<div class="auth"><div class="auth-card"><div class="auth-logo">Edu<span>Nexa</span></div><p class="muted">Smart School Management, Simplified.</p><div id="authErr" class="field"></div><form id="login"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="pass" type="password" required></div><button class="btn primary" style="width:100%">Log in</button></form><div class="auth-switch"><span class="link" id="reset">Forgot password?</span><span class="link" id="signup">Register a school</span></div></div></div>`}
function signupScreen(){return `<div class="auth"><div class="auth-card"><div class="auth-logo">Edu<span>Nexa</span></div><h1>Register your school</h1><p class="muted">Create the school and its first School Admin account.</p><div id="authErr"></div><form id="signupForm"><div class="field"><label>School name</label><input id="sname" required></div><div class="field"><label>Admin full name</label><input id="aname" required></div><div class="field"><label>Email</label><input id="semail" type="email" required></div><div class="field"><label>Password</label><input id="spass" type="password" minlength="6" required></div><div class="field"><label>Confirm password</label><input id="spass2" type="password" minlength="6" required></div><button class="btn primary" style="width:100%">Create school</button></form><p class="muted"><span class="link" id="backLogin">Back to login</span></p></div></div>`}
function errBox(m){$("#authErr").innerHTML=`<div style="background:#feeceb;color:#b42318;padding:10px;border-radius:10px;margin-bottom:12px">${esc(m)}</div>`}
async function loadProfile(){
 const s=await getDoc(doc(db,"users",uid())); if(!s.exists()){await signOut(auth);throw new Error("Your Firebase account has no EduNexa profile yet. Register a school or have a Super Admin create your profile.");}
 me={id:s.id,...s.data()}; if(!me.active)throw new Error("This account is inactive.");
 if(me.schoolId){const ss=await getDoc(doc(db,"schools",me.schoolId));school=ss.exists()?{id:ss.id,...ss.data()}:null}
}
async function audit(action,recordId="",metadata={}){
 if(!me?.schoolId)return;
 await addDoc(collection(db,"auditLogs"),{userId:uid(),role:me.role,schoolId:me.schoolId,action,recordId,timestamp:serverTimestamp(),metadata});
}
async function ensureSettings(){
 if(!me.schoolId)return;
 const ref=doc(db,"settings",me.schoolId),s=await getDoc(ref);
 if(!s.exists())await setDoc(ref,{schoolId:me.schoolId,currentTerm:"First Term",activeSessionId:"",rankingEnabled:true,grades:[
  {min:70,max:100,letter:"A",remark:"Excellent"},{min:60,max:69,letter:"B",remark:"Very Good"},{min:50,max:59,letter:"C",remark:"Good"},{min:45,max:49,letter:"D",remark:"Fair"},{min:40,max:44,letter:"E",remark:"Pass"},{min:0,max:39,letter:"F",remark:"Needs Improvement"}],
 components:[{name:"CA",weight:20},{name:"Exam",weight:80}]});
}
async function counts(col){
 const q=query(collection(db,col),where("schoolId","==",me.schoolId));return (await getDocs(q)).size;
}
async function dashboard(){
 const isSA=me.role==="schoolAdmin", isSuper=me.role==="superAdmin";
 if(isSuper){
  const ss=await getDocs(collection(db,"schools")), schools=ss.docs.map(d=>({id:d.id,...d.data()}));
  const activeSchools=schools.filter(s=>s.active!==false).length;
  const us=await getDocs(query(collection(db,"users"),where("role","==","schoolAdmin")));
  return `<div class="page-head"><div><h1>Platform overview</h1><div class="muted">Multi-school operations at a glance.</div></div></div><div class="cards"><div class="card">Schools<div class="metric">${schools.length}</div></div><div class="card">Active schools<div class="metric">${activeSchools}</div></div><div class="card">School admins<div class="metric">${us.size}</div></div><div class="card">Platform activity<div class="metric">Live</div></div></div><div class="panel" style="margin-top:18px"><h2>Schools</h2><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Status</th></tr></thead><tbody>${schools.slice(0,20).map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.email)}</td><td>${statusBadge(s.active===false?"Inactive":"Active")}</td></tr>`).join("")}</tbody></table></div></div>`;
 }
 if(isSA){
  const [st,te,cl,su,att,fees,pay,ann,res]=await Promise.all(["students","teachers","classes","subjects","attendance","fees","payments","announcements","results"].map(counts));
  return `<div class="page-head"><div><h1>Good day, ${esc((me.fullName||"Admin").split(" ")[0])}</h1><div class="muted">${esc(school?.name||"Your school")} · ${esc(me.role)}</div></div><div class="actions"><button class="btn primary" data-nav="students">Add student</button><button class="btn ghost" data-nav="attendance">Take attendance</button></div></div><div class="cards"><div class="card">Students<div class="metric">${st}</div></div><div class="card">Teachers<div class="metric">${te}</div></div><div class="card">Classes<div class="metric">${cl}</div></div><div class="card">Subjects<div class="metric">${su}</div></div></div><div class="grid" style="margin-top:18px"><div class="panel"><h2>Academic activity</h2><div class="kpi-list"><div class="kpi-row"><span>Attendance records</span><b>${att}</b></div><div class="kpi-row"><span>Results</span><b>${res}</b></div><div class="kpi-row"><span>Fee definitions</span><b>${fees}</b></div><div class="kpi-row"><span>Payments</span><b>${pay}</b></div><div class="kpi-row"><span>Announcements</span><b>${ann}</b></div></div></div><div class="panel"><h2>Quick actions</h2><div class="actions"><button class="btn ghost" data-nav="teachers">Manage teachers</button><button class="btn ghost" data-nav="classes">Manage classes</button><button class="btn ghost" data-nav="assignments">Assignments</button><button class="btn ghost" data-nav="results">Review results</button><button class="btn ghost" data-nav="payments">Review payments</button></div></div></div>`;
 }
 if(me.role==="teacher")return `<div class="page-head"><div><h1>Teacher dashboard</h1><div class="muted">Assigned academic work and submissions.</div></div></div><div class="cards"><div class="card">Role<div class="metric" style="font-size:22px">Teacher</div></div><div class="card">Status<div class="metric" style="font-size:22px">${me.active!==false?"Active":"Inactive"}</div></div></div><div class="panel" style="margin-top:18px"><h2>Continue</h2><div class="actions"><button class="btn primary" data-nav="attendance">Record attendance</button><button class="btn ghost" data-nav="results">Continue result entry</button></div></div>`;
 return `<div class="page-head"><div><h1>Student dashboard</h1><div class="muted">${esc(me.fullName||"Student")} · ${esc(school?.name||"")}</div></div></div><div class="cards"><div class="card">Account<div class="metric" style="font-size:22px">Active</div></div><div class="card">Academic records<div class="metric" style="font-size:22px">Available</div></div></div><div class="panel" style="margin-top:18px"><h2>My school</h2><p>${esc(school?.name||"")}</p><div class="actions"><button class="btn primary" data-nav="results">View results</button><button class="btn ghost" data-nav="attendance">View attendance</button></div></div>`;
}

async function genericCollection(col,fields,title,opts={}){
 const q=query(collection(db,col),where("schoolId","==",me.schoolId));const snap=await getDocs(q);let rows=snap.docs.map(d=>({id:d.id,...d.data()}));
 if(opts.search){const z=opts.search.toLowerCase();rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(z))}
 const headers=fields.map(x=>`<th>${esc(x.label)}</th>`).join("");
 const body=rows.map(r=>`<tr>${fields.map(x=>`<td>${x.render?x.render(r):esc(r[x.key]??"—")}</td>`).join("")}<td><div class="actions">${me.role==="schoolAdmin"&&opts.edit!==false?`<button class="btn ghost small" data-edit="${esc(r.id)}">Edit</button><button class="btn ${r.active===false?"success":"danger"} small" data-toggle="${esc(r.id)}">${r.active===false?"Reactivate":"Deactivate"}</button>`:""}</div></td></tr>`).join("");
 return {rows,html:`<div class="page-head"><div><h1>${esc(title)}</h1><div class="muted">${rows.length} record(s)</div></div>${opts.add?`<button class="btn primary" id="addBtn">+ Add</button>`:""}</div>${opts.search!==false?`<div class="toolbar"><input id="searchBox" placeholder="Search ${esc(title.toLowerCase())}…"></div>`:""}<div class="panel"><div class="table-wrap"><table class="table"><thead><tr>${headers}<th>Actions</th></tr></thead><tbody>${body||`<tr><td colspan="${fields.length+1}" class="empty">No records found.</td></tr>`}</tbody></table></div></div>`};
}

async function studentsView(){
 const f=[{key:"admissionNumber",label:"Admission #",render:r=>esc(r.admissionNumber)},{key:"fullName",label:"Name",render:r=>esc(r.fullName)},{key:"gender",label:"Gender"},{key:"className",label:"Class"},{key:"academicStatus",label:"Academic status"},{key:"active",label:"Status",render:r=>statusBadge(r.active===false?"Inactive":"Active")}];
 const x=await genericCollection("students",f,"Students",{add:true});
 $("#content").innerHTML=x.html;$("#addBtn").onclick=()=>studentForm();wireTable("students");
}
async function studentForm(id=""){
 let r={};if(id){const s=await getDoc(doc(db,"students",id));r={id,...s.data()}}
 openModal(`<h2>${id?"Edit":"Add"} student</h2><form id="entityForm"><div class="form-grid"><div class="field"><label>Admission number</label><input id="admissionNumber" required value="${esc(r.admissionNumber)}"></div><div class="field"><label>Full name</label><input id="fullName" required value="${esc(r.fullName)}"></div><div class="field"><label>First name</label><input id="firstName" value="${esc(r.firstName)}"></div><div class="field"><label>Middle name</label><input id="middleName" value="${esc(r.middleName)}"></div><div class="field"><label>Last name</label><input id="lastName" value="${esc(r.lastName)}"></div><div class="field"><label>Gender</label><select id="gender"><option>Male</option><option>Female</option><option>Other</option></select></div><div class="field"><label>Date of birth</label><input id="dob" type="date" value="${esc(r.dob)}"></div><div class="field"><label>Phone</label><input id="phone" value="${esc(r.phone)}"></div><div class="field"><label>Email</label><input id="email2" type="email" value="${esc(r.email)}"></div><div class="field"><label>Address</label><input id="address" value="${esc(r.address)}"></div><div class="field"><label>Admission date</label><input id="admissionDate" type="date" value="${esc(r.admissionDate||nowDate())}"></div><div class="field"><label>Academic status</label><input id="academicStatus" value="${esc(r.academicStatus||"Active")}"></div><div class="field"><label>Guardian name</label><input id="guardianName" value="${esc(r.guardianName)}"></div><div class="field"><label>Guardian phone</label><input id="guardianPhone" value="${esc(r.guardianPhone)}"></div><div class="field"><label>Emergency contact</label><input id="emergencyContact" value="${esc(r.emergencyContact)}"></div><div class="field"><label>Class ID</label><input id="classId" value="${esc(r.classId)}"></div></div><div class="actions"><button class="btn primary">Save</button><button type="button" class="btn ghost" id="cancel">Cancel</button></div></form>`);
 $("#cancel").onclick=closeModal;$("#entityForm").onsubmit=async e=>{e.preventDefault();const d={schoolId:me.schoolId,admissionNumber:$("#admissionNumber").value.trim(),fullName:$("#fullName").value.trim(),firstName:$("#firstName").value.trim(),middleName:$("#middleName").value.trim(),lastName:$("#lastName").value.trim(),gender:$("#gender").value,dob:$("#dob").value,phone:$("#phone").value.trim(),email:$("#email2").value.trim(),address:$("#address").value.trim(),admissionDate:$("#admissionDate").value,academicStatus:$("#academicStatus").value.trim(),guardianName:$("#guardianName").value.trim(),guardianPhone:$("#guardianPhone").value.trim(),emergencyContact:$("#emergencyContact").value.trim(),classId:$("#classId").value.trim(),active:r.active!==false,updatedAt:serverTimestamp()};if(id)await updateDoc(doc(db,"students",id),d);else{const ref=await addDoc(collection(db,"students"),{...d,createdAt:serverTimestamp()});await audit("student_created",ref.id)}closeModal();toast("Student saved");studentsView()}
}
async function teachersView(){
 const f=[{key:"teacherId",label:"Teacher ID"},{key:"fullName",label:"Name"},{key:"email",label:"Email"},{key:"phone",label:"Phone"},{key:"qualification",label:"Qualification"},{key:"active",label:"Status",render:r=>statusBadge(r.active===false?"Inactive":"Active")}];
 const x=await genericCollection("teachers",f,"Teachers",{add:true});$("#content").innerHTML=x.html;$("#addBtn").onclick=()=>teacherForm();wireTable("teachers");
}
function genPass(){return "EduNexa-"+Math.random().toString(36).slice(2,7)+"!9"}
async function createManagedAuthUser(email,password){
 const name="edunexa-temp-"+Date.now(),cfg={...firebaseConfig,appId:firebaseConfig.appId+"-"+Date.now()};
 const a=initializeApp(cfg,name),b=getAuth(a);try{const c=await createUserWithEmailAndPassword(b,email,password);return c.user.uid}finally{await deleteApp(a)}
}
async function teacherForm(id=""){

async function profileView(){$("#content").innerHTML=`<div class="page-head"><div><h1>Profile</h1><div class="muted">Your EduNexa account.</div></div></div><div class="panel"><div class="grid"><div><b>Name</b><p>${esc(me.fullName||"—")}</p></div><div><b>Email</b><p>${esc(me.email||"—")}</p></div><div><b>Role</b><p>${esc(me.role)}</p></div><div><b>School</b><p>${esc(school?.name||"Platform")}</p></div></div><p class="muted">Use “Forgot password?” on the login screen to change your Firebase password.</p></div>`}
async function schoolsView(){const snap=await getDocs(collection(db,"schools")),rows=snap.docs.map(d=>({id:d.id,...d.data()}));$("#content").innerHTML=`<div class="page-head"><div><h1>Schools</h1><div class="muted">Platform school management.</div></div><button class="btn primary" id="addSchool">+ Add school</button></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.email)}</td><td>${esc(r.phone)}</td><td>${statusBadge(r.active===false?"Inactive":"Active")}</td><td><button class="btn ${r.active===false?"success":"danger"} small data-school-toggle="${r.id}">${r.active===false?"Activate":"Deactivate"}</button></td></tr>`).join("")}</tbody></table></div></div>`;$("#addSchool").onclick=()=>openModal(`<h2>Create school</h2><form id="simple"><div class="field"><label>School name</label><input id="name" required></div><div class="field"><label>Email</label><input id="email" type="email"></div><button class="btn primary">Create</button></form>`);$("#simple")?.addEventListener("submit",async e=>{e.preventDefault();await addDoc(collection(db,"schools"),{name:$("#name").value,email:$("#email").value,active:true,createdAt:serverTimestamp()});closeModal();render()});$("#content").querySelectorAll("[data-school-toggle]").forEach(b=>b.onclick=async()=>{const r=await getDoc(doc(db,"schools",b.dataset.schoolToggle));await updateDoc(r.ref,{active:r.data().active===false});render()})}
async function adminsView(){const q=query(collection(db,"users"),where("role","==","schoolAdmin"));const snap=await getDocs(q);$("#content").innerHTML=`<div class="page-head"><div><h1>School Admins</h1><div class="muted">Platform administrators.</div></div></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>School</th><th>Status</th></tr></thead><tbody>${snap.docs.map(d=>{const r=d.data();return `<tr><td>${esc(r.fullName)}</td><td>${esc(r.email)}</td><td>${esc(r.schoolId)}</td><td>${statusBadge(r.active===false?"Inactive":"Active")}</td></tr>`}).join("")}</tbody></table></div></div>`}
async function render(){if(!me)return;$("#title").textContent=navItems(me.role).find(x=>x[0]===currentView)?.[1]||"EduNexa";try{
 if(currentView==="dashboard")$("#content").innerHTML=await dashboard();
 else if(currentView==="students")await studentsView(); else if(currentView==="teachers")await teachersView(); else if(currentView==="classes")await classesView(); else if(currentView==="subjects")await subjectsView(); else if(currentView==="assignments")await assignmentsView(); else if(currentView==="sessions")await sessionsView(); else if(currentView==="attendance")await attendanceView(); else if(currentView==="results")await resultsView(); else if(currentView==="fees")await feesView(); else if(currentView==="payments")await paymentsView(); else if(currentView==="announcements")await announcementsView(); else if(currentView==="reports")await reportsView(); else if(currentView==="settings")await settingsView(); else if(currentView==="schools")await schoolsView(); else if(currentView==="admins")await adminsView(); else await profileView();
 $("#content").querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{currentView=b.dataset.nav;render()});
}catch(e){console.error(e);$("#content").innerHTML=`<div class="panel"><h2>Couldn't load this page</h2><p class="muted">${esc(e.message)}</p></div>`}}
function appMount(){document.querySelector("#root").innerHTML=shell();$("#logout").onclick=()=>signOut(auth);$("#menu").onclick=()=>$("#side").classList.toggle("open");document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{currentView=b.dataset.nav;$("#side").classList.remove("open");render()});render()}
function showLogin(){document.querySelector("#root").innerHTML=authScreen();$("#login").onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$("#email").value.trim(),$("#pass").value)}catch(x){errBox(x.message)}};$("#signup").onclick=()=>showSignup();$("#reset").onclick=async()=>{const email=prompt("Enter your account email");if(email)try{await sendPasswordResetEmail(auth,email);toast("Password reset link sent.")}catch(e){toast(e.message)}}}
function showSignup(){document.querySelector("#root").innerHTML=signupScreen();$("#backLogin").onclick=showLogin;$("#signupForm").onsubmit=async e=>{e.preventDefault();try{if($("#spass").value!==$("#spass2").value)throw new Error("Passwords do not match.");const c=await createUserWithEmailAndPassword(auth,$("#semail").value.trim(),$("#spass").value);const schoolId="school_"+c.user.uid.slice(0,12);await setDoc(doc(db,"schools",schoolId),{name:$("#sname").value.trim(),email:c.user.email,active:true,logo:"",address:"",phone:"",website:"",motto:"",createdAt:serverTimestamp()});await setDoc(doc(db,"users",c.user.uid),{email:c.user.email,fullName:$("#aname").value.trim(),role:"schoolAdmin",schoolId,active:true,photoURL:"",createdAt:serverTimestamp()});toast("School created.");}catch(x){errBox(x.message)}}}
onAuthStateChanged(auth,async u=>{if(!u){showLogin();return}try{await loadProfile();if(me.role==="schoolAdmin")await ensureSettings();appMount()}catch(e){console.error(e);showLogin();errBox(e.message)}})
</script>
</body>
</html>
