async function enxViewGradeEntry(){
  const [assignments,students,subjects,classes,sessions]=await Promise.all([
    ENX.schoolDocs('teacherAssignments',[where('teacherUid','==',State.user.uid)]),ENX.schoolDocs('students'),ENX.schoolDocs('subjects'),ENX.schoolDocs('classes'),ENX.schoolDocs('academicSessions')
  ]);
  const gs=await enxGradeSettings();
  const comps=(gs.components&&gs.components.length?gs.components:[{key:'ca',label:'CA',max:30,weight:30},{key:'exam',label:'Exam',max:70,weight:70}]);
  const session=enxSelect('Session',sessions.map(s=>({value:s.id,label:s.name})),sessions.find(s=>s.active)?.id||'');
  const term=enxSelect('Term',enxTermOptions(),'First');
  const assignment=enxSelect('Class / Subject',assignments.map(a=>({value:a.id,label:`${a.className||classes.find(c=>c.id===a.classId)?.name||''} — ${a.subjectName||subjects.find(s=>s.id===a.subjectId)?.name||''}`})));
  const area=el('div',{style:'margin-top:14px'});
  const load=enxButton('Load Roster',async()=>{
    const a=assignments.find(x=>x.id===assignment.input.value);if(!a)return toast('Select an assignment first');
    const roster=enxStudentRoster(students,a.classId);
    const old=await getDocs(query(col('results'),where('schoolId','==',_school()),where('classId','==',a.classId),where('subjectId','==',a.subjectId),where('sessionId','==',session.input.value),where('term','==',term.input.value),limit(500)));
    const by=new Map(old.docs.map(d=>[d.data().studentId,{id:d.id,...d.data()}]));
    const rows=roster.map(s=>{const r=by.get(s.id)||{};const inputs={};comps.forEach(c=>inputs[c.key]=enxInput('', 'number', r.components?.[c.key]??'', {min:0,max:Number(c.max),style:'width:80px'}));const total=el('span',{},String(ENX.num(r.total||0)));return {s,inputs,total,old:r};});
    rows.forEach(r=>Object.values(r.inputs).forEach(i=>i.input.addEventListener('input',()=>{let total=0;comps.forEach(c=>{const raw=ENX.num(r.inputs[c.key].input.value);const max=Math.max(1,ENX.num(c.max));const weight=ENX.num(c.weight||c.max);total+=(raw/max)*weight;});r.total.textContent=total.toFixed(2);}))); 
    area.innerHTML='';
    const heads=['Student',...comps.map(c=>`${c.label} (${c.max})`),'Total','Grade'];
    const trRows=rows.map(r=>{const grade=el('span',{},'—');return el('tr',{},[el('td',{},ENX.fullName(r.s)),...comps.map(c=>el('td',{},r.inputs[c.key].input)),el('td',{},r.total),el('td',{},grade)]);});
    area.appendChild(el('div',{class:'card table-wrap'},[_table(heads,trRows)]));
    area.appendChild(el('div',{style:'display:flex;gap:8px;margin-top:10px;flex-wrap:wrap'},[
      enxButton('Save Draft',()=>save('draft')),
      enxButton('Submit for Approval',()=>save('submitted'),'btn secondary')
    ]));
    async function save(status){
      const batch=writeBatch(db);
      rows.forEach(r=>{
        const values={};let total=0;
        comps.forEach(c=>{const raw=ENX.num(r.inputs[c.key].input.value);values[c.key]=raw;const max=Math.max(1,ENX.num(c.max));const weight=ENX.num(c.weight||c.max);total+=(raw/max)*weight;});
        const gr=enxGrade(total,gs.bands);const ref=r.old.id?doc(db,'results',r.old.id):doc(col('results'));
        batch.set(ref,{schoolId:_school(),classId:a.classId,subjectId:a.subjectId,subjectName:a.subjectName||subjects.find(x=>x.id===a.subjectId)?.name||'',studentId:r.s.id,teacherUid:State.user.uid,sessionId:session.input.value,term:term.input.value,components:values,total:Number(total.toFixed(2)),grade:gr.letter,remark:gr.remark,status,updatedAt:serverTimestamp(),createdAt:r.old.createdAt||serverTimestamp()},{merge:true});
      });

    }

async function enxViewReviewResults(){

    el('td',{},subjects.find(s=>s.id===r.subjectId)?.name||r.subjectName||r.subjectId||'—'),
    el('td',{},classes.find(c=>c.id===r.classId)?.name||r.classId||'—'),

}

async function enxViewReports(){
  const [results,students,subjects,classes,sessions,schoolSettings]=await Promise.all([ENX.schoolDocs('results'),ENX.schoolDocs('students'),ENX.schoolDocs('subjects'),ENX.schoolDocs('classes'),ENX.schoolDocs('academicSessions'),ENX.settings()]);
  const sess=enxSelect('Session',sessions.map(s=>({value:s.id,label:s.name})),sessions.find(s=>s.active)?.id||''),term=enxSelect('Term',enxTermOptions(),schoolSettings.currentTerm||'First),cl=enxSelect('Class',[{value:'',label:'All classes'},...classes.map(c=>({value:c.id,label:ENX.labelClass(c)}))],''),st=enxSelect('Student',[{value:'',label:'All students'},...students.map(s=>({value:s.id,label:ENX.fullName(s)}))],'');
  const run=enxButton('Generate Report',()=>renderReport());const area=el('div',{style:'margin-top:14px'});
  async function renderReport(){
    const rr=results.filter(r=>['published','locked','approved'].includes(r.status)&&(!sess.input.value||r.sessionId===sess.input.value)&&(!term.input.value||r.term===term.input.value)&&(!cl.input.value||r.classId===cl.input.value)&&(!st.input.value||r.studentId===st.input.value));
    if(!rr.length){area.innerHTML='';area.appendChild(enxEmpty('No approved/published results match those filters.','📄'));return;}
    const groups={};rr.forEach(r=>(groups[r.studentId]??=[]).push(r));
    const ranking=(schoolSettings.grading||{}).ranking!==false;
    const classIds=[...new Set(rr.map(r=>r.classId).filter(Boolean))];
    const allClassResults=results.filter(r=>['published','locked','approved'].includes(r.status)&&(!sess.input.value||r.sessionId===sess.input.value)&&(!term.input.value||r.term===term.input.value)&&classIds.includes(r.classId));
    const avgBy={};allClassResults.forEach(r=>(avgBy[r.studentId]??=[]).push(ENX.num(r.total)));const avgList=Object.entries(avgBy).map(([id,v])=>({id,avg:v.reduce((a,n)=>a+n,0)/v.length})).sort((a,b)=>b.avg-a.avg);const posBy={};avgList.forEach((x,i)=>posBy[x.id]=i+1);
    area.innerHTML='';
    Object.entries(groups).forEach(([sid,list])=>{
      const student=students.find(s=>s.id===sid)||{},school=State.activeSchool||{},avg=list.reduce((a,r)=>a+ENX.num(r.total),0)/Math.max(1,list.length);
      const rows=list.map(r=>{const g=enxGrade(r.total,(schoolSettings.grading||{}).bands);const componentText=r.components?Object.entries(r.components).map(([k,v])=>`${k}: ${v}`).join(' • '):`CA: ${r.ca??0} • Exam: ${r.exam??0}`;return el('tr',{},[el('td',{},subjects.find(s=>s.id===r.subjectId)?.name||r.subjectName||r.subjectId||'—'),el('td',{},componentText),el('td',{},String(r.total??0)),el('td',{},r.grade||g.letter),el('td',{},r.remark||g.remark)]);});
      const position=ranking&&posBy[sid]?String(posBy[sid]):'—';
      const card=el('div',{class:'card report-card',style:'margin-bottom:16px'},[
        el('div',{class:'report-header'},[el('h2',{},school.name||'EduNexa School'),el('p',{},school.motto||''),el('p',{},`${ENX.fullName(student)} • ${student.admissionNumber||''} • ${classes.find(c=>c.id===student.classId)?.name||student.className||''}`)]),
        el('div',{class:'table-wrap'},[_table(['Subject','Assessment Components','Total','Grade','Remark'],rows)]),
        el('div',{class:'grid grid-3',style:'margin-top:12px'},[el('div',{class:'card stat'},[el('div',{class:'num'},avg.toFixed(2)),el('div',{class:'lbl'},'Average')]),el('div',{class:'card stat'},[el('div',{class:'num'},String(list.length)),el('div',{class:'lbl'},'Subjects')]),el('div',{class:'card stat'},[el('div',{class:'num'},position),el('div',{class:'lbl'},'Position')])]),
        el('p',{class:'help'},`Session: ${sessions.find(s=>s.id===sess.input.value)?.name||'—'} • Term: ${term.input.value}`)
      ]);
      card.appendChild(el('div',{style:'display:flex;gap:8px;margin-top:10px'},[enxButton('Print',()=>{const w=window.open('','_blank');if(!w)return toast('Allow pop-ups to print the report');w.document.write(`<html><head><title>EduNexa Report Card</title><style>body{font-family:Arial;padding:24px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:8px;text-align:left}.card{border:0}.stat{display:inline-block;width:30%;padding:8px}</style></head><body>${card.outerHTML}</body></html>`);w.document.close();w.print();},'btn secondary')]));
      area.appendChild(card);
    });
  }
  return shell(el('div',{},[enxPage('Reports & Report Cards','Filter results, calculate averages/positions and print report cards'),el('div',{class:'card grid grid-4'},[sess.wrap,term.wrap,cl.wrap,st.wrap,run]),area]));
}

async function enxViewMyFees(){
  const [fees,payments]=await Promise.all([ENX.schoolDocs('fees'),ENX.schoolDocs('payments',[where('studentId','==',State.user.uid)])]);
  const totalDue=fees.filter(f=>f.active!==false).reduce((a,f)=>a+ENX.num(f.amount),0),confirmed=payments.filter(p=>p.status==='confirmed').reduce((a,p)=>a+ENX.num(p.amount),0);

    const save=enxButton('Submit',async()=>{save.disabled=true;try{if(ENX.num(amount.input.value)<=0)throw new Error('Enter a valid amount');let receiptImage=null;if(receipt.files?.[0])receiptImage=await compressImage(receipt.files[0],900,0.68);await addDoc(col('payments'),{schoolId:_school(),studentId:State.user.uid,amount:ENX.num(amount.input.value),date:date.input.value,reference:ref.input.value,method:method.input.value,note:note.input.value,receiptImage:receiptImage||null,status:'pending',createdAt:serverTimestamp()});await audit('payment.submitted',{schoolId:_school()});toast('Payment submitted for review');bg.remove();navigate('myFees');}catch(e){toast(authErrorMessage(e));}finally{save.disabled=false;}});foot.append(save);

async function enxViewSuperAdminAdminsComplete(){
  if(!eduSuper())return scaffoldView('Access denied','Super Admin access is required.');
  const [users,schools]=await Promise.all([
    getDocs(query(col('users'),where('role','in',['owner','schoolAdmin']),limit(300))),
    getDocs(query(col('schools'),limit(300)))

  const name=enxInput('Full name','text',''),email=enxInput('Email','email',''),school=enxSelect('School',schoolList.map(x=>({value:x.id,label:x.name||x.id})),schoolList[0]?.id||'');
  const create=enxButton('Create School Admin',async()=>{
    if(!name.input.value||!email.input.value||!school.input.value)return toast('Name, email and school are required');

      const password=tempPassword();const u=await createManagedAccount(email.input.value,password);
      await setDoc(doc(db,'users',u.uid),{uid:u.uid,schoolId:school.input.value,role:'owner',active:true,email:email.input.value.trim().toLowerCase(),displayName:name.input.value.trim(),createdAt:serverTimestamp(),createdBy:State.user.uid});
      await setDoc(doc(db,'schoolUsers',`${school.input.value}_${u.uid}`),{uid:u.uid,schoolId:school.input.value,role:'owner',isOwner:true,isPrincipal:false,status:'active',email:email.input.value.trim().toLowerCase(),createdAt:serverTimestamp(),createdBy:State.user.uid});

    }catch(e){toast(authErrorMessage(e));}finally{create.disabled=false;}

    el('td',{},u.displayName||u.email||u.id),el('td',{},u.email||'—'),el('td',{},schoolList.find(x=>x.id===u.schoolId)?.name||u.schoolId||'—'),el('td',{},_status(u.active===false?'inactive':'active')),
    el('td',{},enxButton(u.active===false?'Activate':'Deactivate',async()=>{const active=u.active===false;await updateDoc(doc(db,'users',u.id),{active,updatedAt:serverTimestamp()});await updateDoc(doc(db,'schoolUsers',`${u.schoolId}_${u.id}`),{status:active?'active':'inactive',updatedAt:serverTimestamp()});await audit('school.admin.status.changed',{schoolId:u.schoolId,targetId:u.id});toast(active?'School Admin activated':'School Admin deactivated');navigate('superAdminAdmins');},'btn sm'))

}

<style>
/* =====================================================================
   EDUNEXA — DESIGN SYSTEM
   ===================================================================== */
:root{
  --bg:#f6f7fb; --surface:#ffffff; --surface-2:#f1f3f9; --border:#e4e7ef;
  --text:#151826; --text-dim:#5b6072; --brand:#4338ca; --brand-2:#6d5bf5;
  --success:#16a34a; --warning:#d97706; --danger:#dc2626; --info:#0284c7;
  --radius:14px; --radius-sm:9px; --shadow:0 1px 2px rgba(20,20,40,.04),0 8px 24px -12px rgba(20,20,40,.12);
  --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#0b0d14; --surface:#141826; --surface-2:#1b2032; --border:#262c40;
  --text:#eef0f6; --text-dim:#9aa1b6; --brand:#8b7bff; --brand-2:#a394ff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .2s,color .2s}
button,input,select,textarea{font-family:inherit;color:inherit}
a{color:var(--brand)}
h1,h2,h3,h4{margin:0 0 4px}
p{margin:0 0 8px;color:var(--text-dim)}
.hidden{display:none !important}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

/* ---------- layout shell ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.topbar .brand{font-weight:800;font-size:18px;background:linear-gradient(135deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.topbar .spacer{flex:1}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:hover{background:var(--border)}
.shell{flex:1;display:flex;min-height:0}
.sidebar{width:240px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.sidebar a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--text-dim);text-decoration:none;font-size:14px;font-weight:600;cursor:pointer}
.sidebar a:hover{background:var(--surface-2)}
.sidebar a.active{background:var(--brand);color:#fff}
.main{flex:1;min-width:0;padding:20px;overflow-y:auto}
.bottomnav{display:none;position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:6px 4px;z-index:40}
.bottomnav .row{display:flex;justify-content:space-around}
.bottomnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--text-dim);text-decoration:none;padding:6px;flex:1}
.bottomnav a.active{color:var(--brand)}
@media (max-width:860px){
  .sidebar{display:none}
  .bottomnav{display:block}
  .main{padding:14px;padding-bottom:70px}
}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
@media (max-width:860px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}}

.stat .num{font-size:26px;font-weight:800}

(function(){

      '<div class="center-screen">' +
        '<div class="card auth-card" style="text-align:center">' +

  });
  window.addEventListener("unhandledrejection", function(e){
    console.error("EduNexa unhandled rejection:", e.reason);
  });
  window.__eduNexaStartupError = showStartupError;
})();

<script>

    if (app && app.querySelector("#startupScreen") && !window.__eduNexaModuleStarted) {
      if (window.__eduNexaStartupError) {
        window.__eduNexaStartupError(
          "EduNexa could not load its Firebase engine. This usually means the browser could not download the Firebase JavaScript modules. Check that you are opening the HTTPS GitHub Pages address, then reload. If it continues, use the diagnostic details below."
        );
      }
    }
  }, 9000);
})();

<script type="module">
/* =====================================================================
   1. CONFIGURATION
   ===================================================================== */
// Firebase is loaded with a CDN fallback. This makes the GitHub Pages build
// resilient when one CDN is unavailable or filtered by a network.
async function loadFirebaseModule(primary, fallback){
  try { return await import(primary); }
  catch (firstError) {
    try { return await import(fallback); }
    catch (secondError) {
      const e = new Error(`Firebase module failed to load. Primary: ${firstError?.message || firstError}; Fallback: ${secondError?.message || secondError}`);
      e.code = "edunexa/firebase-module-load-failed";
      throw e;
    }
  }
}
const firebaseAppModule = await loadFirebaseModule(
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
  "https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app.js"
);
const firebaseAuthModule = await loadFirebaseModule(
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",

);

  collection, query, where, orderBy, limit, onSnapshot, serverTimestamp,

} = firebaseFirestoreModule;

window.__eduNexaModuleStarted = true;

const firebaseConfig = {

  authDomain: "edunexa-70b24.firebaseapp.com",
  projectId: "edunexa-70b24",
  storageBucket: "edunexa-70b24.firebasestorage.app",

/* =====================================================================

   ===================================================================== */
const State = {
  user: null,            // firebase auth user
  platformAdmin: null,   // platformAdmins/{uid} doc if any
  memberships: [],       // all schoolUsers docs for this uid
  platformAdminStatus: null, // diagnostic status for platform-admin provisioning

function clearListeners(){ State.listeners.forEach(u=>{try{u()}catch(e){}}); State.listeners = []; }

/* =====================================================================
   3. PERMISSIONS
   Navigation and action-gating are derived from effective role(s).
   This is UX convenience only — Firestore Rules remain the real boundary (§91,§134).
   ===================================================================== */
function effectiveRole(){
  if (State.platformAdmin) return State.platformAdmin.level === "super" ? "superAdmin" : "supportAdmin";
  return State.activeMembership ? State.activeMembership.role : null;
}
function isAcademicAdmin(){
  const r = effectiveRole();
  return r === "principal" || r === "vicePrincipal" || (State.activeMembership && State.activeMembership.isPrincipal);
}
function isSchoolAdmin(){
  const r = effectiveRole();
  return r === "owner" || r === "schoolAdmin" || r === "principal" || (State.activeMembership && State.activeMembership.isOwner);
}
function can(action){
  const r = effectiveRole();
  const map = {
    approveSchools: ["superAdmin"],
    managePlatformSettings: ["superAdmin"],
    manageSupportAdmins: ["superAdmin"],
    manageBranding: ["owner","schoolAdmin","principal","superAdmin"],
    manageStaff: ["owner","schoolAdmin","principal","superAdmin"],
    manageStudents: ["registrar","principal","vicePrincipal","owner","schoolAdmin"],
    approveAssignments: ["principal","vicePrincipal"],
    assignTeachers: ["principal","vicePrincipal"],
    enterGrades: ["teacher"],
    reviewResults: ["principal","vicePrincipal"],
    lockResults: ["principal","vicePrincipal"],
    print: ["printer","principal","vicePrincipal","owner","schoolAdmin"],
    viewOwnChildren: ["parent"]
  };
  if (r === "superAdmin") return true;
  return (map[action]||[]).includes(r) || (action==="manageBranding"&&isSchoolAdmin()) ||
    (action==="approveAssignments"&&isAcademicAdmin()) || (action==="reviewResults"&&isAcademicAdmin()) ||
    (action==="lockResults"&&isAcademicAdmin());
}

/* client-side image compression for logos/signatures/stamps (§28,§86,§139) */
function compressImage(file, maxDim=300, quality=0.72){
  return new Promise((resolve,reject)=>{
    if (!file.type.startsWith("image/")) return reject(new Error("Not an image"));
    if (file.size > 8*1024*1024) return reject(new Error("Image too large (max 8MB source)"));
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.onload = ()=>{
      let {width,height} = img;
      if (width>height && width>maxDim){ height*=maxDim/width; width=maxDim; }
      else if (height>maxDim){ width*=maxDim/height; height=maxDim; }
      const canvas = document.createElement("canvas");
      canvas.width=width; canvas.height=height;
      canvas.getContext("2d").drawImage(img,0,0,width,height);
      const dataUrl = canvas.toDataURL("image/jpeg", quality);
      if (dataUrl.length > 350000) return reject(new Error("Compressed image still too large — pick a simpler image"));
      resolve(dataUrl);
    }; img.onerror=reject; img.src = e.target.result; };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

/* =====================================================================
   5. UI UTILITIES
   ===================================================================== */
function toast(msg, kind="default"){
  const wrap = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 3600);
}
function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k==="class") e.className=v;
    else if (k==="html") e.innerHTML=v; // only used for trusted static fragments in this file
    else if (k.startsWith("on") && typeof v==="function") e.addEventListener(k.slice(2), v);
    else if (v!==false && v!==null && v!==undefined) e.setAttribute(k,v);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if (c===null||c===undefined) return;
    e.appendChild(typeof c==="string" ? document.createTextNode(c) : c);
  });
  return e;
}
function fmtDate(ts){
  if (!ts) return "—";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});
}
function statusBadge(status){
  const map = {
    pending:"amber", active:"green", expiring:"amber", expired:"red", suspended:"red", rejected:"red",
    draft:"gray", submitted:"blue", approved:"green", locked:"green", voided:"red"
  };
  return el("span",{class:`badge ${map[status]||"gray"}`}, (status||"—").toUpperCase());
}
function modal(title, bodyEl, footerEl){
  const bg = el("div",{class:"modal-bg", onclick:(e)=>{ if(e.target===bg) bg.remove(); }});
  const m = el("div",{class:"modal"},[
    el("h3",{},title),
    bodyEl,
    footerEl || null
  ]);
  bg.appendChild(m);
  document.body.appendChild(bg);
  return bg;
}
function confirmAction(text, onConfirm){
  const footer = el("div",{style:"display:flex;gap:8px;justify-content:flex-end;margin-top:16px"});
  const bg = modal("Please confirm", el("p",{},text), footer);
  footer.appendChild(el("button",{class:"btn ghost", onclick:()=>bg.remove()},"Cancel"));
  footer.appendChild(el("button",{class:"btn danger", onclick:()=>{ bg.remove(); onConfirm(); }},"Confirm"));
}
function setTheme(t){
  State.theme = t; localStorage.setItem("edunexa_theme", t);
  const sys = window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", t==="system" ? (sys?"dark":"light") : t);

setTheme(State.theme);

/* =====================================================================
   6. ROUTING
   ===================================================================== */
function navigate(route, params={}){
  clearListeners();
  State.route = route; State.routeParams = params;
  render();
}
window.addEventListener("hashchange", ()=>{
  const h = location.hash.replace("#","");
  if (h && h!==State.route) navigate(h);
});

/* =====================================================================
   7. AUTH FLOWS
   ===================================================================== */
async function loadUserContext(){
  // Platform admins are platform-scoped and DO NOT need a school membership.
  // The authoritative record is platformAdmins/{uid}; schoolUsers is only for
  // school-scoped users.
  const uSnap = await getDoc(doc(db,"platformAdmins", State.user.uid));
  State.platformAdmin = uSnap.exists() ? {id:uSnap.id, ...uSnap.data()} : null;
  State.platformAdminStatus = State.platformAdmin ? "linked" : "missing";

  const q = query(col("schoolUsers"), where("uid","==",State.user.uid));
  const snap = await getDocs(q);
  State.memberships = snap.docs.map(d=>({id:d.id, ...d.data()}));

  if (State.platformAdmin){
    State.activeSchoolId = null; State.activeSchool = null; State.activeMembership = null;
    navigate("superAdminDashboard");
    return;
  }
  if (State.memberships.length === 0){
    // Do not describe a platform-admin account as "not linked to a school".
    // Platform admins intentionally have no school membership.
    navigate(State.platformAdminStatus === "missing" ? "platformAdminSetup" : "noAccess");
    return;
  }
  await selectSchool(State.memberships[0].schoolId);
}
async function selectSchool(schoolId){
  State.activeSchoolId = schoolId;
  const [sSnap, mSnap] = await Promise.all([
    getDoc(doc(db,"schools",schoolId)),
    getDoc(doc(db,"schoolUsers", schoolId+"_"+State.user.uid))
  ]);
  State.activeSchool = sSnap.exists() ? {id:sSnap.id, ...sSnap.data()} : null;
  State.activeMembership = mSnap.exists() ? mSnap.data() : null;
  navigate(roleHomeRoute());
}
function roleHomeRoute(){
  const r = effectiveRole();
  const map = {
    superAdmin:"superAdminDashboard", supportAdmin:"superAdminDashboard",
    owner:"ownerDashboard", schoolAdmin:"ownerDashboard", principal:"principalDashboard", vicePrincipal:"principalDashboard",
    registrar:"registrarDashboard", teacher:"teacherDashboard", printer:"printerDashboard", parent:"parentDashboard", student:"studentDashboard"
  };
  return map[r] || "noAccess";
}

let __eduAuthSettled = false;
onAuthStateChanged(auth, async (u)=>{
  __eduAuthSettled = true;
  State.user = u;
  if (!u){ State.platformAdmin=null; State.memberships=[]; State.activeSchoolId=null;
    State.activeSchool=null; State.activeMembership=null; navigate("login"); return; }
  navigate("loading");
  try{ await loadUserContext(); }
  catch(e){ console.error("EduNexa context error:", e); toast(authErrorMessage(e)); navigate("login"); }
});

// Firebase Auth can take a while to resolve on some mobile networks. Do not
// leave the user staring at a spinner: after a short grace period, show the
// login screen while the auth observer continues in the background.
setTimeout(()=>{
  const appRoot=document.getElementById("app");
  if(!__eduAuthSettled && State.route==="loading" && appRoot && appRoot.querySelector("#startupScreen")){
    navigate("login");
    toast("Firebase is taking longer than usual. You can still try signing in.");
  }
},3500);

async function doLogin(email, password, btn){
  btn.disabled = true;
  try{ await signInWithEmailAndPassword(auth, email, password); }
  catch(e){ toast(authErrorMessage(e)); btn.disabled=false; }
}
async function doSignup(email, password, displayName, btn){
  btn.disabled = true;
  try{
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    if (displayName) await updateProfile(cred.user, { displayName });
  } catch(e){ toast(authErrorMessage(e)); btn.disabled=false; }
}
function authErrorMessage(e){
  const map = {
    "auth/invalid-email":"That email address looks invalid.",
    "auth/user-not-found":"No account found with that email.",
    "auth/wrong-password":"Incorrect password.",
    "auth/invalid-credential":"Incorrect email or password.",
    "auth/email-already-in-use":"An account with that email already exists.",
    "auth/weak-password":"Password should be at least 6 characters.",
    "auth/network-request-failed":"Network error — check your connection.",
    "auth/operation-not-allowed":"Email/Password sign-in isn't enabled for this Firebase project yet (Firebase Console → Authentication → Sign-in method → enable Email/Password).",
    "auth/too-many-requests":"Too many attempts — please wait a moment and try again.",
    "permission-denied":"Permission denied by Firestore rules. Make sure the latest firestore.rules have been deployed to this exact project.",
    "unavailable":"Firestore is unreachable — check your connection, or that a Firestore Database has been created for this project."
  };
  if (map[e.code]) return map[e.code];
  // Surface the raw code/message instead of a generic string so real
  // misconfiguration (rules not deployed, auth provider off, wrong project, etc.) is visible.
  return (e.code ? `[${e.code}] ` : "") + (e.message || "Unknown error — check the browser console for details.");
}

   8. VIEWS — AUTH
   ===================================================================== */
function viewLoading(){
  return el("div",{class:"center-screen"}, el("div",{class:"skeleton", style:"width:64px;height:64px;border-radius:16px"}));

function viewLogin(){
  const wrap = el("div",{class:"center-screen"});
  const card = el("div",{class:"card auth-card"});

  const pass = el("input",{type:"password", placeholder:"Password"});

  btn.onclick = ()=>doLogin(email.value.trim(), pass.value, btn);
  const forgot = el("a",{style:"font-size:12px;cursor:pointer"},"Forgot password?");
  forgot.onclick = async ()=>{
    if (!email.value) return toast("Enter your email first");
    try{ await sendPasswordResetEmail(auth, email.value.trim()); toast("Password reset email sent"); }
    catch(e){ toast(authErrorMessage(e)); }
  };

/* =====================================================================
   INVITE REDEMPTION — Teacher / Parent / Registrar join via School Code +
   Invitation Code (§83: invitations are scoped, tied to a role/school,
   and never grant unrestricted access by themselves).
   ===================================================================== */
function genInviteCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let c = ""; for (let i=0;i<8;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}
function viewRedeemInvite(){
  const wrap = el("div",{class:"center-screen"});
  const card = el("div",{class:"card auth-card"});
  const isLoggedIn = !!State.user;
  const schoolCode = el("input",{type:"text", placeholder:"e.g. RX-7K2M9P", style:"text-transform:uppercase"});
  const inviteCode = el("input",{type:"text", placeholder:"8-character invitation code", style:"text-transform:uppercase"});
  const nameField = el("input",{type:"text", placeholder:"Full name"});
  const email = el("input",{type:"email", placeholder:"you@example.com"});
  const pass = el("input",{type:"password", placeholder:"Choose a password (min 6 chars)"});

  const btn = el("button",{class:"btn", style:"width:100%;margin-top:6px"}, isLoggedIn ? "Join School" : "Create Account & Join");
  btn.onclick = ()=>redeemInvite({
    schoolCode: schoolCode.value.trim().toUpperCase(),
    inviteCode: inviteCode.value.trim().toUpperCase(),
    name: nameField.value.trim(), email: email.value.trim(), password: pass.value
  }, btn, isLoggedIn);

  const fields = [
    el("div",{class:"field"},[el("label",{class:"req"},"School Code"), schoolCode]),
    el("div",{class:"field"},[el("label",{class:"req"},"Invitation Code"), inviteCode])
  ];
  if (!isLoggedIn){
    fields.push(el("div",{class:"field"},[el("label",{class:"req"},"Full Name"), nameField]));
    fields.push(el("div",{class:"field"},[el("label",{class:"req"},"Email"), email]));
    fields.push(el("div",{class:"field"},[el("label",{class:"req"},"Password"), pass]));
  }
  card.append(
    el("div",{style:"text-align:center;margin-bottom:18px"},[
      el("div",{class:"topbar brand", style:"font-size:24px;justify-content:center;border:none;padding:0"},"EduNexa"),
      el("p",{},"Join your school as a Teacher, Parent, or other invited staff using the codes your school gave you.")
    ]),
    ...fields,
    btn,
    el("div",{style:"text-align:center;margin-top:12px"}, el("a",{style:"font-size:12px;cursor:pointer", onclick:()=>navigate("login")}, "Back to sign in"))
  );
  wrap.appendChild(card);
  return wrap;
}
async function redeemInvite({schoolCode, inviteCode, name, email, password}, btn, isLoggedIn){
  if (!schoolCode || !inviteCode) return toast("Enter the school code and invitation code");
  if (!isLoggedIn && (!email || password.length<6)) return toast("Enter a valid email and a password of at least 6 characters");
  btn.disabled = true;
  try{
    const schoolSnap = await getDocs(query(col("schools"), where("schoolCode","==",schoolCode)));
    if (schoolSnap.empty){ toast("No school found with that code"); btn.disabled=false; return; }
    const school = { id: schoolSnap.docs[0].id, ...schoolSnap.docs[0].data() };

    const invSnap = await getDocs(query(col("schoolInvitations"),
      where("schoolId","==",school.id), where("code","==",inviteCode), where("used","==",false)));
    if (invSnap.empty){ toast("Invalid or already-used invitation code"); btn.disabled=false; return; }
    const invite = { id: invSnap.docs[0].id, ...invSnap.docs[0].data() };

    let user = State.user;
    if (!isLoggedIn){
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      user = cred.user;
      if (name) await updateProfile(user, { displayName: name });
    }

    await updateDoc(doc(db,"schoolInvitations",invite.id), { used:true, consumedBy:user.uid, consumedAt: serverTimestamp() });
    await setDoc(doc(db,"schoolUsers", school.id+"_"+user.uid), {
      uid: user.uid, schoolId: school.id, role: invite.role, inviteId: invite.id,
      isOwner:false, isPrincipal:false, status:"active", email: user.email, createdAt: serverTimestamp()
    });
    await audit("invite.redeemed", { schoolId: school.id, targetType:"invitation", targetId: invite.id });
    toast(`Welcome! You've joined ${school.name} as ${ROLE_LABELS[invite.role]}.`);
    await loadUserContext();
  }catch(e){ console.error(e); toast(authErrorMessage(e)); btn.disabled=false; }
}

function viewRegisterSchool(){
  const wrap = el("div",{class:"center-screen"});
  const card = el("div",{class:"card", style:"max-width:520px;width:100%"});
  let step = 0;
  const data = { schoolName:"", address:"", phone:"", email:"", schoolType:"Primary & Secondary",
    motto:"", website:"", isOwner:true, ownerEmail:"", ownerPassword:"" };

  function stepInfo(){
    const f = (label,key,type="text",required=true)=>{
      const inp = el("input",{type, value:data[key]||"", oninput:e=>data[key]=e.target.value});
      return el("div",{class:"field"},[el("label",{class:required?"req":""},label), inp]);
    };
    return el("div",{},[
      el("h3",{},"1. School Information"),
      f("School Name","schoolName"), f("Address","address"), f("Phone","phone"),
      f("School Email","email","email"), f("School Type","schoolType"),
      f("Motto (optional)","motto","text",false), f("Website (optional)","website","text",false)
    ]);
  }
  function stepOwner(){
    const yesNo = el("select",{onchange:e=>data.isOwner = e.target.value==="yes"},[
      el("option",{value:"yes"},"Yes, I am the School Owner"),
      el("option",{value:"no"},"No, I'm registering on behalf of the school")
    ]);
    const em = el("input",{type:"email", value:data.ownerEmail, oninput:e=>data.ownerEmail=e.target.value});
    const pw = el("input",{type:"password", placeholder:"Choose a password (min 6 chars)", oninput:e=>data.ownerPassword=e.target.value});
    return el("div",{},[
      el("h3",{},"2. Owner Account"),
      el("div",{class:"field"},[el("label",{},"Is the registrant the School Owner?"), yesNo]),
      el("div",{class:"field"},[el("label",{class:"req"},"Your Account Email"), em]),
      el("div",{class:"field"},[el("label",{class:"req"},"Password"), pw]),
      el("p",{class:"help"},"Your school will enter a pending state until the Super Admin approves your registration and payment.")
    ]);
  }
  function stepReview(){
    return el("div",{},[
      el("h3",{},"3. Review & Submit"),
      el("p",{},`${data.schoolName} — ${data.schoolType}`),
      el("p",{},data.address),
      el("p",{class:"help"},"After submitting, you'll receive a unique school code and can proceed to payment for Super Admin review.")
    ]);
  }

  const dots = el("div",{class:"step-dots"});
  const body = el("div",{});
  const nav = el("div",{style:"display:flex;justify-content:space-between;margin-top:14px"});

  function renderStep(){
    dots.innerHTML=""; for(let i=0;i<3;i++) dots.appendChild(el("span",{class:i<=step?"done":""}));
    body.innerHTML=""; body.appendChild([stepInfo,stepOwner,stepReview][step]());
    nav.innerHTML="";
    const back = el("button",{class:"btn ghost", onclick:()=>{ if(step>0){step--; renderStep();} else navigate("login"); }}, step===0?"Cancel":"Back");
    const next = el("button",{class:"btn", onclick: async ()=>{
      if (step===0 && !data.schoolName){ toast("School name required"); return; }
      if (step===1 && (!data.ownerEmail || data.ownerPassword.length<6)){ toast("Valid email + 6-char password required"); return; }
      if (step<2){ step++; renderStep(); return; }
      next.disabled = true;
      try{
        const cred = await createUserWithEmailAndPassword(auth, data.ownerEmail.trim(), data.ownerPassword);
        const schoolCode = genSchoolCode();
        const schoolRef = await addDoc(col("schools"), {
          name: data.schoolName, address: data.address, phone: data.phone, email: data.email,
          schoolType: data.schoolType, motto: data.motto, website: data.website,
          schoolCode, subscriptionStatus: "pending", subscriptionPrice: SUBSCRIPTION_PRICE_DEFAULT,
          subscriptionExpiresAt: null, createdAt: serverTimestamp(), createdBy: cred.user.uid
        });
        await setDoc(doc(db,"schoolUsers", schoolRef.id+"_"+cred.user.uid), {
          uid: cred.user.uid, schoolId: schoolRef.id, role: "owner", isOwner: true,
          isPrincipal: false, status: "active", email: data.ownerEmail, createdAt: serverTimestamp()
        });
        await audit("school.registered", { schoolId: schoolRef.id });
        toast(`School registered! Your code is ${schoolCode}`);
        // The auth observer may have fired before the school membership was
        // written. Reload the context now so registration lands in the new
        // school workspace instead of the temporary No Access screen.
        await loadUserContext();
      }catch(e){ toast(authErrorMessage(e)); next.disabled=false; }
    }}, step===2?"Submit Registration":"Next");
    nav.append(back, next);
  }
  renderStep();
  card.append(el("div",{class:"topbar brand", style:"border:none;padding:0 0 12px;font-size:20px"},"EduNexa — School Registration"), dots, body, nav);
  wrap.appendChild(card);
  return wrap;
}

      const ca = el("input",{type:"number", min:0, max:30, placeholder:"CA", style:"width:70px"});

    ]));

      const batch = writeBatch(db);
      rows.forEach(r=>{
        const ca = Number(r.ca.value||0), exam = Number(r.exam.value||0);
        const ref = doc(col("results"));
        batch.set(ref, {
          schoolId, classId: assignment.classId, subjectId: assignment.subjectId, studentId: r.studentId,
          teacherUid: State.user.uid, ca, exam, total: ca+exam, status, createdAt: serverTimestamp()
        });

      toast(status==="submitted" ? "Results submitted for approval" : "Draft saved");
    }catch(e){ toast("Save failed: "+e.message); }

   ===================================================================== */
async function finalizeReportCard(studentId, classId, sessionId, termId){
  // Authoritative recalculation from locked results only (§95,§163)
  const rSnap = await getDocs(query(col("results"), where("schoolId","==",State.activeSchoolId),
    where("studentId","==",studentId), where("status","==","locked")));
  const results = rSnap.docs.map(d=>d.data());
  const total = results.reduce((a,r)=>a+(r.total||0),0);
  const reportId = genReportId();
  const ref = await addDoc(col("reportCards"), {
    schoolId: State.activeSchoolId, studentId, classId, sessionId, termId, reportId,
    subjects: results.map(r=>({subjectId:r.subjectId, ca:r.ca, exam:r.exam, total:r.total})),
    overallTotal: total, status: "final", createdAt: serverTimestamp(), createdBy: State.user.uid
  });
  await setDoc(doc(db,"reportVerification",reportId), {
    schoolId: State.activeSchoolId, studentId, reportCardId: ref.id, valid: true, createdAt: serverTimestamp()
  });
  await audit("report.finalized", { schoolId: State.activeSchoolId, targetType:"reportCard", targetId: ref.id });
  return ref.id;
}
function renderQR(container, url){
  container.innerHTML = "";
  // eslint-disable-next-line no-undef

}
async function viewPublicVerify(token){
  const content = el("div",{class:"center-screen"});
  const card = el("div",{class:"card", style:"max-width:420px;width:100%;text-align:center"});
  card.appendChild(el("h3",{},"Verifying report…"));
  content.appendChild(card);
  try{
    const snap = await getDoc(doc(db,"reportVerification",token));
    card.innerHTML = "";
    if (!snap.exists()){
      card.append(el("div",{class:"big"},"❌"), el("h3",{},"Not Found"), el("p",{},"No report matches this verification code."));
    } else {
      const v = snap.data();
      const schoolSnap = await getDoc(doc(db,"schools",v.schoolId));
      const studentSnap = await getDoc(doc(db,"students",v.studentId));
      const valid = v.valid !== false;
      card.append(
        el("div",{class:"big"}, valid?"✅":"⛔"),
        el("h3",{}, valid?"VALID REPORT":"VOID / INVALID"),
        el("p",{}, schoolSnap.exists()?schoolSnap.data().name:"—"),
        el("p",{}, studentSnap.exists()?`${studentSnap.data().firstName} ${studentSnap.data().lastName}`:"—"),
        el("p",{class:"help"}, "Report ID: "+token)
      );
    }
  }catch(e){ card.innerHTML=""; card.append(el("p",{},"Verification failed. Please try again.")); }
  return content;
}

const ENX = {
  async schoolDocs(name, extras=[], max=500){
    const qParts=[where('schoolId','==',_school()), ...extras, limit(max)];
    const snap=await getDocs(query(col(name),...qParts));
    return snap.docs.map(d=>({id:d.id,...d.data()}));
  },
  async all(name, max=500){
    const snap=await getDocs(query(col(name),limit(max)));
    return snap.docs.map(d=>({id:d.id,...d.data()}));
  },
  async settings(){
    const s=await getDoc(doc(db,'settings',_school()));
    return s.exists()?s.data():{};
  },
  async saveSettings(patch){
    await setDoc(doc(db,'settings',_school()),{schoolId:_school(),...patch,updatedAt:serverTimestamp(),updatedBy:State.user.uid},{merge:true});
  },
  num(v){ const n=Number(v); return Number.isFinite(n)?n:0; },
  date(v){ return v || new Date().toISOString().slice(0,10); },
  labelClass(c){ return c ? `${c.level||''}${c.arm?' — '+c.arm:''}`.trim() : 'Unassigned'; },

  escText(v){ return String(v??''); },
  async pickSchool(){

  },
  async notifyMany(uids, title, body, schoolId=_school(), link=''){

    unique.forEach(uid=>batch.set(doc(col('notifications')),{recipientUid:uid,schoolId,title,body,link,read:false,createdAt:serverTimestamp()}));

};
